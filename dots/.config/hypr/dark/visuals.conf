source = $HOME/.cache/wal/colors-hyprland
exec-once = $HOME/Scripts/theme.sh
exec-once = hyprctl setcursor "Breeze_Default" 24
env = XCURSOR_THEME = "Breeze_Default"

# windowrule = opacity 0.9 0.8, match:class .*
windowrule = opacity 1 1, match:class obsidian

    general {
# See https://wiki.hyprland.org/Configuring/Variables/ for more

        gaps_in = 20
            gaps_out = 30
            border_size = 4
            # col.active_border = $color4 $color3 $color5 45deg
            col.active_border = $color4
            col.inactive_border = $color5
            # col.inactive_border = rgba(595959aa)

            layout = dwindle
    }

decoration {
# See https://wiki.hyprland.org/Configuring/Variables/ for more

    # rounding = 10
        blur {
            enabled = no
                size = 8
                passes = 2
                new_optimizations = on
        }

    shadow {

        enabled = yes
            range = 5
            render_power = 3
            color = $backgroundCol
            offset = 15, 15
    }
}

group {
    col.border_active = $color4 $color3 $color5 45deg
        col.border_inactive = rgba(595959aa)

        groupbar {
            font_family = FiraCode Nerd Font
                font_size = 14
                col.active = $color3 $color4 
                col.inactive = 0x595959aa
        }
}

animations {
    enabled = yes

# Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
        bezier = myBezier, 0.05, 0.9, 0.1, 1.05
        animation = windows, 1, 4, myBezier
        animation = windowsOut, 1, 4, default, popin 30%
        animation = border, 1, 10, default
        animation = borderangle, 1, 8, default
        animation = fade, 1, 7, default
        animation = workspaces, 1, 3, default
}


